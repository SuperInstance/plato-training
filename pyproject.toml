[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "plato-training"
version = "0.9.0"
description = "PLATO Training Rooms — micro models for ensigns, deployed anywhere"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
semantic = ["model2vec", "faiss-cpu"]
gpu = ["torch>=2.0"]
onnx = ["onnxruntime", "onnx"]
all = ["pytest>=7.0", "model2vec", "faiss-cpu", "torch>=2.0", "onnxruntime", "onnx"]

[project.scripts]
plato-train = "plato_training.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]

[tool.setuptools.packages.find]
include = ["*"]
exclude = ["tests*"]
