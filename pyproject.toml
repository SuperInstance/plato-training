[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "plato-training"
version = "0.9.0"
description = "PLATO Training Rooms — micro models for ensigns, deployed anywhere"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
plato-train = "plato_training.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src", "."]
